<style>
:root{
  /* Palet gaya Ko-fi: biru langit, koral, mint, kuning; teks mirage gelap */
  --bg:#effaff; --card:#ffffff; --ink:#192025; --muted:#5f6f7a; --line:#dce7eb;
  --brown:#467ceb; --brown-d:#192025; --caramel:#ffb520; --cream:#def3ff; --accent:#305de0;
  --blue:#00aff1; --blue-d:#0072ab; --coral:#ff5e5b;
  --diff:#fff1c6; --diff-b:#ffb520; --good:#1fa57f; --bad:#e8423f;
  --display:"Bricolage Grotesque","DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --r:24px; --r-sm:14px; --shadow:0 4px 18px rgba(25,32,37,.07);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 "DM Sans","Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-optical-sizing:auto;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
header.top{background:#fff;color:var(--ink);padding:12px 16px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);box-shadow:0 2px 12px rgba(25,32,37,.06);display:grid;grid-template-columns:1fr;gap:2px 16px}
header.top h1{margin:0;font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.04em;line-height:1.1;color:var(--ink)}
header.top .sub{font-size:12.5px;color:var(--muted);margin-bottom:8px}
nav{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{color:var(--ink);text-decoration:none;padding:8px 16px;border-radius:999px;font-family:var(--display);font-weight:700;white-space:nowrap;font-size:14.5px;letter-spacing:-.01em;background:transparent;transition:background .15s,color .15s}
nav a:hover{background:var(--cream)}
nav a.active{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(0,175,241,.35)}
main{max-width:1100px;margin:0 auto;padding:20px 14px 56px}
h2{font-family:var(--display);font-size:32px;font-weight:800;margin:6px 0 16px;color:var(--ink);letter-spacing:-.04em;line-height:1.08}
h3{font-family:var(--display);font-size:18px;font-weight:700;margin:0 0 10px;color:var(--ink);letter-spacing:-.02em;line-height:1.25}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.stat .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:700}
.stat .val{font-family:var(--display);font-size:40px;font-weight:800;color:var(--blue-d);line-height:1.05;letter-spacing:-.04em;margin-top:6px;font-variant-numeric:tabular-nums lining-nums;overflow-wrap:anywhere}
.stat .hint{font-size:12px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:18px;box-shadow:var(--shadow)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.filters label{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em}
input,select,button{font:inherit}
input[type=text],input[type=search],input[type=date],input[type=number],input[type=password],textarea,select{width:100%;padding:9px 14px;border:1.5px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);min-height:42px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,175,241,.2)}
button,.btn{background:var(--brown);color:#fff;border:0;border-radius:999px;padding:9px 20px;cursor:pointer;font-family:var(--display);font-weight:700;letter-spacing:-.01em;min-height:42px;text-decoration:none;display:inline-block;transition:background .15s,transform .05s}
button:hover,.btn:hover{background:#305de0}
button:active,.btn:active{transform:translateY(1px)}
button.ghost,.btn.ghost{background:transparent;color:var(--brown);border:1.5px solid var(--brown)}
button.ghost:hover,.btn.ghost:hover{background:var(--cream)}
button:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.empty{text-align:center;padding:32px 14px;color:var(--muted);background:#fff;border:2px dashed #b9cdd6;border-radius:var(--r)}
.empty b{display:block;font-family:var(--display);color:var(--ink);font-size:20px;letter-spacing:-.03em;margin-bottom:4px}
.error{background:#ffe2e1;border:1px solid #ffa2a0;color:#7f1f0f;border-radius:var(--r-sm);padding:14px;margin-bottom:12px}
.warn{background:#fffaeb;border:1px solid #ffda6e;color:#7a2e0d;border-radius:var(--r-sm);padding:12px;margin-bottom:12px;font-size:13px}
.loading{text-align:center;padding:40px;color:var(--muted)}
.spinner{width:30px;height:30px;border:3px solid var(--cream);border-top-color:var(--blue);border-radius:50%;margin:0 auto 10px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.list{display:grid;gap:12px}
.brew{display:block;color:inherit;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s,border-color .15s}
.brew:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,175,241,.15)}
.brew .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.brew .t{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.025em;line-height:1.25;color:var(--ink);overflow-wrap:anywhere}
.brew .meta{font-size:13px;color:var(--muted);margin-top:2px}
.brew .params{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.brew .notes{margin-top:10px;font-size:13.5px}
.score{min-width:48px;text-align:center;border-radius:999px;padding:4px 10px;font-family:var(--display);font-weight:800;color:#fff;background:var(--blue);font-size:18px;letter-spacing:-.02em;font-variant-numeric:tabular-nums lining-nums;flex:none}
.score.hi{background:var(--good)} .score.mid{background:var(--caramel);color:#461602} .score.lo{background:var(--coral)} .score.na{background:#b4b4b4}
.chip{display:inline-block;background:var(--cream);color:var(--blue-d);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600}
.chip.pick{cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:6px 13px;user-select:none}
.chip.pick:hover{border-color:var(--blue)}
.chip.pick.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.chip.pick.off{opacity:.55}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.chartbox{position:relative;height:340px}
.chartbox.sm{height:300px}
dl.info{display:grid;grid-template-columns:minmax(110px,170px) 1fr;gap:8px 12px;margin:0}
dl.info dt{color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding-top:2px}
dl.info dd{margin:0;overflow-wrap:anywhere}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff}
table.cmp{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.cmp th,table.cmp td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;min-width:110px}
table.cmp thead th{background:var(--cream);color:var(--ink);position:sticky;top:0;white-space:nowrap;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
table.cmp th.sticky,table.cmp td.sticky{position:sticky;left:0;background:#f7fbfe;font-weight:700;color:var(--ink);min-width:130px;z-index:1;box-shadow:1px 0 0 var(--line)}
table.cmp thead th.sticky{z-index:2;background:var(--cream)}
table.cmp tr.sect td{background:var(--cream);font-weight:800;color:var(--blue-d);text-transform:uppercase;font-size:11.5px;letter-spacing:.09em}
table.cmp td.diff{background:var(--diff);box-shadow:inset 3px 0 0 var(--diff-b)}
table.cmp td.base{color:var(--muted)}
.delta{display:inline-block;font-size:11px;font-weight:700;margin-left:5px;padding:0 6px;border-radius:999px;background:#fff;border:1px solid var(--diff-b);color:#94370c}
.legend{font-size:12.5px;color:var(--muted);margin:6px 0 8px}
.legend i{display:inline-block;width:14px;height:12px;background:var(--diff);border-left:3px solid var(--diff-b);vertical-align:middle;margin-right:4px}
.crumbs{margin-bottom:12px;font-size:13.5px;font-weight:600}
.crumbs a{color:var(--brown)}
a{color:var(--accent)}
.beanrow{display:flex;gap:12px;align-items:center;justify-content:space-between}

textarea{border-radius:var(--r-sm);min-height:120px;resize:vertical;line-height:1.5;display:block}
button.sm,.btn.sm{padding:5px 14px;min-height:34px;font-size:13px}
button.ai{background:var(--blue-d)} button.ai:hover{background:#005a87}
button.ai.ghost{background:transparent;color:var(--blue-d);border:1.5px solid var(--blue-d)} button.ai.ghost:hover{background:var(--cream)}
.brew .bmain{display:block;color:inherit;text-decoration:none}
.brew .bfoot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px}
.brew .btweak{flex:1 1 200px;min-width:0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.brew .bfoot button{margin-left:auto;flex:none}
.brew .bai:empty{display:none}
.brew .bai .inl{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.brew .bai .inl h3{font-size:16px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.field label{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em}
.field.wide{grid-column:1/-1}
.field.ai input,.field.ai select,.field.ai textarea{background:#f3fbff;border-color:var(--blue)}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:3px}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-top:8px}
.check input{width:18px;height:18px;accent-color:var(--blue)}
.ok{background:#e3f8f0;border:1px solid #8fdcc2;color:#0d5a43;border-radius:var(--r-sm);padding:12px 14px;margin-bottom:12px}
.setup{background:#fffaeb;border:1px dashed #ffb520;border-radius:var(--r);padding:16px;margin-bottom:16px}
.setup code{background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:13px}
fieldset{border:0;padding:0;margin:0}
fieldset:disabled{opacity:.55}
.ovl{position:fixed;inset:0;background:rgba(25,32,37,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:var(--r) var(--r) 0 0;padding:18px;box-shadow:0 -8px 30px rgba(25,32,37,.25)}
@media(min-width:760px){.ovl{align-items:center;padding:20px}.sheet{border-radius:var(--r)}}
.aires h4{font-family:var(--display);font-size:16px;margin:16px 0 4px;letter-spacing:-.02em;color:var(--blue-d)}
.aires p{margin:6px 0}.aires ul,.aires ol{margin:6px 0;padding-left:22px}.aires li{margin:3px 0}
.aires{overflow-wrap:anywhere}
.aiq{display:flex;gap:8px;margin:10px 0}.aiq input{flex:1}
@media(min-width:760px){
  header.top{grid-template-columns:auto 1fr;grid-template-areas:"t n" "s n";align-items:center;padding:12px 28px}
  header.top h1{grid-area:t}
  header.top .sub{grid-area:s;margin-bottom:0}
  nav{grid-area:n;justify-content:flex-end}
}
@media(max-width:520px){
  main{padding:16px 10px 48px}
  h2{font-size:27px}
  header.top h1{font-size:22px}
  .stat .val{font-size:30px}
  dl.info{grid-template-columns:1fr}
  dl.info dt{margin-top:6px}
  .chartbox{height:300px}
  .card,.panel{padding:14px;border-radius:20px}
}

/* Grafik */
.gfilters{padding:14px 16px}
.gfrow{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--cream);border-radius:999px;padding:3px;gap:2px}
.seg.wrap{flex-wrap:wrap;border-radius:18px;margin-bottom:10px}
.seg button{background:transparent;color:var(--ink);border:0;min-height:34px;padding:5px 14px;font-size:13.5px;border-radius:999px}
.seg button:hover{background:#fff}
.seg button.on{background:var(--blue);color:#fff;box-shadow:0 2px 6px rgba(0,175,241,.35)}
.gstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.gstat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 14px;box-shadow:var(--shadow);min-width:0}
.gstat b{display:block;font-family:var(--display);font-size:26px;font-weight:800;color:var(--blue-d);line-height:1.1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.gstat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.pnote{margin:-4px 0 8px}
.dots i{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 3px 0 8px;vertical-align:baseline}
.hbarwrap{max-height:470px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.hbarwrap .chartbox{height:auto}
.tog{margin:8px 0 0;text-align:center}
@media(max-width:520px){.gstats{grid-template-columns:repeat(2,1fr)}.gstat b{font-size:22px}.seg button{padding:5px 11px}}

/* Navigasi: bilah tab bawah di layar kecil */
nav a .ic{display:none}
@media(max-width:759px){
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;overflow:visible;background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(25,32,37,.08);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;border-radius:16px;font-size:11.5px;line-height:1.2;min-width:0;min-height:52px;color:var(--muted)}
  nav a span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  nav a .ic{display:block;width:22px;height:22px}
  nav a.active{background:var(--cream);color:var(--blue-d);box-shadow:none}
  nav a[data-r=catat]{background:var(--coral);color:#fff;box-shadow:0 3px 10px rgba(255,94,91,.4)}
  nav a[data-r=catat]:hover{background:#ee4f4c}
  nav a[data-r=catat].active{background:#e8423f;box-shadow:0 0 0 3px rgba(255,94,91,.3)}
  header.top .sub{margin-bottom:2px}
}
</style>

<script id="logic">
var FIELD = {
  biji: {
    id: 'ID Biji', nama: 'Nama Biji / Lot', roastery: 'Roastery', negara: 'Negara',
    region: 'Region / Terroir', farm: 'Farm / Produsen', altitude: 'Ketinggian (mdpl)',

    flavorNotes: 'Catatan Roastery (flavor notes)', catatan: 'Catatan Pribadi'
  },
  seduh: {
    id: 'ID Seduhan', tanggal: 'Tanggal Seduh', biji: 'ID Biji', hari: 'Hari Sejak Roasting',
    dripper: 'Dripper', filter: 'Kertas Filter', air: 'Merek Air', suhu: 'Suhu Air (C)',
    dosis: 'Dosis Kopi (g)', airTotal: 'Air Total (g)', rasio: 'Rasio', grinder: 'Grinder',
    grind: 'Setting Grind', pouring: 'Pouring Interval (detik per langkah)', waktu: 'Total Brew Time',
    aroma: 'Aroma (1-5)', flavor: 'Flavor (1-5)', aftertaste: 'Aftertaste (1-5)',
    acidity: 'Acidity (1-5)', sweetness: 'Sweetness (1-5)', body: 'Body (1-5)', balance: 'Balance (1-5)',
    deskriptor: 'Deskriptor Rasa / Notes', skor: 'Skor Keseluruhan (1-10)',
    catatan: 'Catatan Pribadi', tweak: 'Tweak Berikutnya'
  }
};

var SCA = [
  { key: 'Aroma (1-5)', label: 'Aroma' },
  { key: 'Flavor (1-5)', label: 'Flavor' },
  { key: 'Aftertaste (1-5)', label: 'Aftertaste' },
  { key: 'Acidity (1-5)', label: 'Acidity' },
  { key: 'Sweetness (1-5)', label: 'Sweetness' },
  { key: 'Body (1-5)', label: 'Body' },
  { key: 'Balance (1-5)', label: 'Balance' }
];

var BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function isBlank(v) { return v === null || v === undefined || v === ''; }
function isNum(v) { return typeof v === 'number' && isFinite(v); }

/** "yyyy-MM-dd..." -> epoch UTC hari (ms) atau null */
function parseDay(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
  if (!m) return null;
  return Date.UTC(+m[1], +m[2] - 1, +m[3]);
}

function daysBetween(fromIso, toIso) {
  var a = parseDay(fromIso), b = parseDay(toIso);
  if (a === null || b === null) return null;
  return Math.round((b - a) / 86400000);
}

function fmtDate(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
  if (!m) return isBlank(s) ? '' : String(s);
  return (+m[3]) + ' ' + BULAN[+m[2] - 1] + ' ' + m[1];
}

function fmtNum(n, digits) {
  if (!isNum(n)) return '';
  var d = digits === undefined ? 1 : digits;
  var r = Math.round(n * Math.pow(10, d)) / Math.pow(10, d);

/** Urut tanggal seduh (kosong di akhir); sekunder berdasarkan baris sheet */

    if (da === null) return 1;

/** Ringkasan untuk kartu */

  scored.forEach(function (s) {

function normForCompare(v, type) {
  if (isBlank(v)) return '';

/**
 * Hasil: { sections:[{section}|{label, cells:[{raw,text,diff,delta,base}], differs, nodiff}] }
 * Pembanding (baseline) = seduhan pertama (kolom paling kiri). Sel yang berbeda dari baseline diberi diff=true.
 * Baris dianggap "differs" bila ada dua nilai berbeda di antara seduhan (nilai kosong tidak dihitung beda
 * dari nilai terisi hanya bila semuanya kosong).
 */
function buildCompare(brews) {
  var rows = [];
  COMPARE_ROWS.forEach(function (r) {
    if (r.section) { rows.push({ section: r.section }); return; }
    var norms = brews.map(function (b) { return normForCompare(b[r.key], r.type); });
    var distinct = {};
    norms.forEach(function (n) { distinct[n] = true; });
    var differs = Object.keys(distinct).length > 1;
    var baseRaw = brews.length ? brews[0][r.key] : null;
    var cells = brews.map(function (b, i) {
      var raw = b[r.key];
      var cell = { raw: raw, text: displayValue(raw, r), diff: false, delta: '', base: i === 0 };
      if (!r.nodiff && i > 0 && norms[i] !== norms[0]) {
        cell.diff = true;
        if (r.type === 'num' && isNum(raw) && isNum(baseRaw)) {
          var d = Math.round((raw - baseRaw) * 100) / 100;
          if (d !== 0) cell.delta = (d > 0 ? '+' : '') + fmtNum(d, 2);
        }
      }
      return cell;
    });
    rows.push({ label: r.label, key: r.key, cells: cells, differs: differs && !r.nodiff, nodiff: !!r.nodiff });
  });
  return rows;
}

    if (!best || s[FIELD.seduh.skor] >= best[FIELD.seduh.skor]) best = s;
  });
  return {

    brews: mine,
    count: mine.length,

/* ---------- helper agregasi untuk halaman Grafik (murni, tanpa DOM) ---------- */
var DAY_MS = 86400000;

function dayNum(s) { var t = parseDay(s); return t === null ? null : Math.round(t / DAY_MS); }
/** Nomor hari -> "2 Okt". */
function dayLabel(n) { var d = new Date(n * DAY_MS); return d.getUTCDate() + ' ' + BULAN[d.getUTCMonth()]; }
/** Potong teks panjang dengan elipsis. */
function truncate(str, n) {
  str = isBlank(str) ? '' : String(str);
  if (str.length <= n) return str;
  return str.slice(0, Math.max(1, n - 1)).replace(/\s+$/, '') + '\u2026';
}
/** Nomor seri tanggal Google Sheets -> "yyyy-MM-dd". */
function serialToIso(n) { return new Date(SERIAL_EPOCH + Math.floor(n) * DAY_MS).toISOString().slice(0, 10); }
/** Sel tanggal yang terbaca sebagai angka (nomor seri Sheets) dijadikan "yyyy-MM-dd". Mengubah data di tempat. */
function normalizeDates(data) {
  function fix(rows, keys) {
    (rows || []).forEach(function (r) {
      keys.forEach(function (k) { if (isNum(r[k]) && r[k] > 20000 && r[k] < 80000) r[k] = serialToIso(r[k]); });
    });
  }
  if (data) {
    fix(data.seduhan, [FIELD.seduh.tanggal]);
    fix(data.biji, [FIELD.biji.roast, FIELD.biji.beli]);
  }

}

/** Dimensi pengelompokan skor pada grafik kategori. */

];

  if (dim === 'negara') return bean && !isBlank(bean[FIELD.biji.negara]) ? String(bean[FIELD.biji.negara]).trim() : '';
  if (dim === 'dripper') return isBlank(s[FIELD.seduh.dripper]) ? '' : String(s[FIELD.seduh.dripper]).trim();

/** Filter seduhan untuk Grafik. f: {days, biji, proses, negara, dripper}; today = "yyyy-MM-dd". */
function graphFilter(brews, idx, f, today) {
  f = f || {};
  var days = f.days ? Number(f.days) : 0;
  var cutoff = days > 0 && dayNum(today) !== null ? dayNum(today) - days : null;
  var low = function (v) { return String(v === null || v === undefined ? '' : v).trim().toLowerCase(); };
  return (brews || []).filter(function (s) {
    var bean = idx[s[FIELD.seduh.biji]];
    if (f.biji && String(s[FIELD.seduh.biji]) !== String(f.biji)) return false;
    if (f.proses && low(bean && bean[FIELD.biji.proses]) !== low(f.proses)) return false;
    if (f.negara && low(bean && bean[FIELD.biji.negara]) !== low(f.negara)) return false;
    if (f.dripper && low(s[FIELD.seduh.dripper]) !== low(f.dripper)) return false;
    if (cutoff !== null) {
      var d = dayNum(s[FIELD.seduh.tanggal]);
      if (d === null || d < cutoff) return false;
    }
    return true;
  });
}

/**
 * Rata-rata skor per kelompok. keyFn(s) -> string | {key,label} | ''.
 * Hasil terurut: rata-rata menurun, lalu jumlah seduhan menurun, lalu label.
 */
function groupScores(brews, keyFn) {
  var map = {}, order = [];
  (brews || []).forEach(function (s) {
    var sc = s[FIELD.seduh.skor];
    if (!isNum(sc)) return;
    var k = keyFn(s);
    if (k === null || k === undefined || k === '') return;
    var key = typeof k === 'object' ? String(k.key) : String(k).trim().toLowerCase();
    var label = typeof k === 'object' ? k.label : String(k).trim();
    if (!map[key]) { map[key] = { key: key, label: label, n: 0, sum: 0, min: sc, max: sc }; order.push(key); }
    var g = map[key];
    g.n++; g.sum += sc; g.min = Math.min(g.min, sc); g.max = Math.max(g.max, sc);
  });
  return order.map(function (k) { var g = map[k]; g.avg = g.sum / g.n; return g; }).sort(function (a, b) {
    return (b.avg - a.avg) || (b.n - a.n) || String(a.label).localeCompare(String(b.label), 'id');
  });
}

function beanScores(brews, idx) {
  return groupScores(brews, function (s) {
    var id = s[FIELD.seduh.biji];
    if (isBlank(id)) return '';

  });
}
function dimScores(brews, idx, dim) {

}

/** Rata-rata tiap atribut SCA (null bila tidak ada data sama sekali). */
function attrAverages(brews) {

/** Titik tren skor (urut tanggal). Seduhan di hari yang sama digeser sedikit agar tidak menumpuk. */
function trendPoints(brews, idx) {
  var list = sortBrews((brews || []).filter(function (s) {
    return isNum(s[FIELD.seduh.skor]) && dayNum(s[FIELD.seduh.tanggal]) !== null;
  }), 'asc');
  var perDay = {};
  list.forEach(function (s) { var d = dayNum(s[FIELD.seduh.tanggal]); perDay[d] = (perDay[d] || 0) + 1; });
  var seen = {};
  return list.map(function (s) {
    var d = dayNum(s[FIELD.seduh.tanggal]), n = perDay[d], i = seen[d] || 0;
    seen[d] = i + 1;
    var step = Math.min(0.2, 0.8 / Math.max(1, n));
    var id = s[FIELD.seduh.biji];
    return {
      x: d + (i - (n - 1) / 2) * step, y: s[FIELD.seduh.skor], day: d,
      beanId: isBlank(id) ? '' : String(id), bean: beanLabel(idx[id], id),
      brewId: isBlank(s[FIELD.seduh.id]) ? '' : String(s[FIELD.seduh.id]),
      dripper: isBlank(s[FIELD.seduh.dripper]) ? '' : String(s[FIELD.seduh.dripper])
    };
  });
}

/** Rata-rata geser (n titik terakhir) untuk garis tren. */
function movingAvg(points, n) {
  return points.map(function (p, i) {
    var from = Math.max(0, i - n + 1), sum = 0;
    for (var j = from; j <= i; j++) sum += points[j].y;
    return { x: p.x, y: sum / (i - from + 1) };
  });
}

/** Jumlah seduhan per pekan (rentang <= 100 hari) atau per bulan. */
function activityBuckets(brews) {
  var days = (brews || []).map(function (s) { return dayNum(s[FIELD.seduh.tanggal]); }).filter(function (d) { return d !== null; });
  if (!days.length) return { unit: 'week', buckets: [] };
  var first = Math.min.apply(null, days), last = Math.max.apply(null, days);
  var unit = last - first <= 100 ? 'week' : 'month';
  var scoreByDay = {};
  (brews || []).forEach(function (s) {
    var d = dayNum(s[FIELD.seduh.tanggal]);
    if (d === null) return;
    (scoreByDay[d] = scoreByDay[d] || []).push(s[FIELD.seduh.skor]);
  });
  var out = [], i;
  if (unit === 'week') {
    var mon = function (d) { return d - ((new Date(d * DAY_MS).getUTCDay() + 6) % 7); };
    var m0 = mon(first), m1 = mon(last);
    for (var m = m0; m <= m1; m += 7) out.push({ start: m, end: m + 6, label: dayLabel(m), count: 0, scores: [] });
    days.forEach(function (d) { out[Math.floor((mon(d) - m0) / 7)].count++; });
    out.forEach(function (b) { for (var d = b.start; d <= b.end; d++) if (scoreByDay[d]) b.scores = b.scores.concat(scoreByDay[d]); });
    out = out.slice(-14);
  } else {
    var a = new Date(first * DAY_MS), z = new Date(last * DAY_MS);
    var y = a.getUTCFullYear(), mo = a.getUTCMonth();
    while (y < z.getUTCFullYear() || (y === z.getUTCFullYear() && mo <= z.getUTCMonth())) {
      out.push({ y: y, m: mo, label: BULAN[mo] + ' ' + String(y).slice(2), count: 0, scores: [] });
      mo++; if (mo > 11) { mo = 0; y++; }
    }
    Object.keys(scoreByDay).forEach(function (k) {
      var dt = new Date(+k * DAY_MS);
      for (i = 0; i < out.length; i++) {
        if (out[i].y === dt.getUTCFullYear() && out[i].m === dt.getUTCMonth()) { out[i].count += scoreByDay[k].length; out[i].scores = out[i].scores.concat(scoreByDay[k]); break; }
      }
    });
    out = out.slice(-12);
  }
  out.forEach(function (b) { b.avg = avg(b.scores); });
  return { unit: unit, buckets: out };
}

/** Markdown sederhana (judul ##, daftar, **tebal**, _miring_) -> HTML aman. */
function miniMarkdown(text) {
  var lines = String(text === null || text === undefined ? '' : text).replace(/\r/g, '').split('\n');
  var out = [], list = null;
  function inline(t) {
    return esc(t).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[\s(])_([^_]+)_(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>');
  }
  function close() { if (list) { out.push('</' + list + '>'); list = null; } }
  lines.forEach(function (ln) {
    var m;
    if ((m = /^\s*#{1,6}\s+(.*)$/.exec(ln))) { close(); out.push('<h4>' + inline(m[1]) + '</h4>'); }
    else if ((m = /^\s*[-*•]\s+(.*)$/.exec(ln))) { if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inline(m[1]) + '</li>'); }
    else if ((m = /^\s*\d+[.)]\s+(.*)$/.exec(ln))) { if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inline(m[1]) + '</li>'); }
    else if (/^\s*$/.test(ln)) { close(); }
    else { close(); out.push('<p>' + inline(ln) + '</p>'); }
  });
  close();
  return out.join('');
}

/** Gabungkan alamat backend dengan query. */
function backendUrl(base, query) {
  return base + (base.indexOf('?') === -1 ? '?' : '&') + query;
}

    if (!chosen.length) h += emptyBox('Belum ada yang dipilih', 'Pilih minimal satu seduhan di atas.');
    else h += compareTable(chosen);
    h += '</div>';

    h += '<div class="grid2"><div class="panel"><h3>Radar skor SCA</h3>' +
      (chartsAvailable() ? '<div class="chartbox"><canvas id="beanRadar"></canvas></div>' : chartMissing()) + '</div>' +
      '<div class="panel"><h3>Skor keseluruhan</h3>' +
      (chartsAvailable() ? '<div class="chartbox"><canvas id="beanTime"></canvas></div>' : chartMissing()) + '</div></div>';

    app.innerHTML = h;

    $('#pick').addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('.pick') : e.target;
      if (!t || !t.getAttribute('data-k')) return;
      var k = t.getAttribute('data-k'), cur = state.compareSel[id], i = cur.indexOf(k);
      if (i === -1) cur.push(k); else cur.splice(i, 1);
      var scroll = window.pageYOffset;
      renderBijiDetail(id);
      window.scrollTo(0, scroll);
    });
    if (chartsAvailable()) {
      drawRadar('beanRadar', chosen);
      drawTime('beanTime', id, 'bar');
    }
  }

  function compareTable(brews) {
    var rows = buildCompare(brews);
    var h = '<div class="legend"><i></i>Sel kuning = berbeda dari seduhan pertama (pembanding); angka kecil = selisih.</div>' +
      '<div class="tablewrap"><table class="cmp"><thead><tr><th class="sticky">Parameter</th>' +
      brews.map(function (s, i) {
        return '<th>' + esc(fmtDate(s[S.tanggal]) || 'Tanpa tanggal') + (isBlank(s[S.id]) ? '' : '<div class="small muted">#' + esc(s[S.id]) + (i === 0 ? ' · pembanding' : '') + '</div>') +
          (isBlank(s[S.id]) ? '' : '<div style="margin-top:4px">' + aiButton({ brew: s[S.id] }, 'Analisa') + '</div>') + '</th>';
      }).join('') + '</tr></thead><tbody>';
    rows.forEach(function (r) {
      if (r.section) { h += '<tr class="sect"><td colspan="' + (brews.length + 1) + '">' + esc(r.section) + '</td></tr>'; return; }
      h += '<tr><td class="sticky">' + esc(r.label) + '</td>' + r.cells.map(function (c) {
        var cls = (c.diff ? 'diff' : '') + (c.base ? ' base' : '');
        return '<td class="' + cls + '">' + (c.text === '' ? '<span class="muted">–</span>' : esc(c.text)) +
          (c.delta ? '<span class="delta">' + esc(c.delta) + '</span>' : '') + '</td>';
      }).join('') + '</tr>';
    });
    return h + '</tbody></table></div>';
  }

  /* ---------- halaman: grafik ---------- */
  var GF_TOP = 8;
  var CLR = { hi: '#1fa57f', mid: '#ffb520', lo: '#ff5e5b', na: '#b4b4b4', blue: '#00aff1', blueD: '#0072ab' };
  function isTouch() { return !!(window.matchMedia && window.matchMedia('(hover: none)').matches); }
  function narrow() { return window.innerWidth < 520; }
  function scoreColor(v) { return CLR[scoreClass(v)]; }
  var lastTap = {};
  /** Klik di desktop langsung membuka; di layar sentuh ketukan pertama hanya menampilkan tooltip. */
  function openHref(canvasId, href) {
    if (!href) return;
    if (isTouch() && lastTap[canvasId] !== href) { lastTap[canvasId] = href; return; }
    lastTap[canvasId] = '';
    location.hash = href;
  }
  function hoverPointer(e, els) { if (e && e.native && e.native.target) e.native.target.style.cursor = els.length ? 'pointer' : 'default'; }
  var valuePlugin = {
    id: 'kopiValues',
    afterDatasetsDraw: function (chart) {
      var ctx = chart.ctx, ds = chart.data.datasets[0], meta = chart.getDatasetMeta(0);
      if (!ds || !meta) return;
      ctx.save();
      ctx.font = '700 11px "DM Sans",system-ui,sans-serif'; ctx.fillStyle = '#192025'; ctx.textBaseline = 'middle';
      meta.data.forEach(function (bar, i) { ctx.fillText(fmtNum(ds.data[i], 1), bar.x + 6, bar.y); });
      ctx.restore();
    }
  };

  function gfOptions(list, cur, allLabel) {
    return '<option value="">' + esc(allLabel) + '</option>' + list.map(function (x) {
      var v = Array.isArray(x) ? x[0] : x, l = Array.isArray(x) ? x[1] : x;
      return '<option value="' + esc(v) + '"' + (String(cur).toLowerCase() === String(v).toLowerCase() ? ' selected' : '') + '>' + esc(truncate(l, 36)) + '</option>';
    }).join('');
  }

  function renderGrafik() {
    var d = state.data, gf = state.gf;
    if (!d.seduhan.length) { app.innerHTML = '<h2>Grafik</h2>' + emptyBox('Belum ada data seduhan', 'Grafik akan muncul setelah ada seduhan di tab "Seduhan".'); return; }
    if (!chartsAvailable()) { app.innerHTML = '<h2>Grafik</h2>' + chartMissing(); return; }
    var beans = d.biji.map(function (b) { return [b[B.id], beanLabel(b)]; }).sort(function (a, b) { return a[1].localeCompare(b[1], 'id'); });
    var seg = [['30', '30 hari'], ['90', '90 hari'], ['', 'Semua']].map(function (r) {
      return '<button type="button" class="' + (String(gf.days) === r[0] ? 'on' : '') + '" data-days="' + r[0] + '">' + r[1] + '</button>';
    }).join('');
    app.innerHTML = '<h2>Grafik</h2><div class="panel gfilters">' +
      '<div class="gfrow"><div class="seg" id="gseg" role="group" aria-label="Periode">' + seg + '</div><span class="spacer"></span>' +
      '<button type="button" class="ghost sm" id="greset">Reset</button></div>' +
      '<div class="filters" style="margin:10px 0 0">' +
      '<div><label for="gbiji">Beans</label><select id="gbiji">' + gfOptions(beans, gf.biji, 'Semua beans') + '</select></div>' +
      '<div><label for="gproses">Proses</label><select id="gproses">' + gfOptions(uniqueValues(d.biji, B.proses), gf.proses, 'Semua proses') + '</select></div>' +
      '<div><label for="gnegara">Negara</label><select id="gnegara">' + gfOptions(uniqueValues(d.biji, B.negara), gf.negara, 'Semua negara') + '</select></div>' +
      '<div><label for="gdripper">Dripper</label><select id="gdripper">' + gfOptions(uniqueValues(d.seduhan, S.dripper), gf.dripper, 'Semua dripper') + '</select></div>' +
      '</div></div><div id="gcontent"></div>';

    function bind(id, key) { $('#' + id).addEventListener('change', function () { gf[key] = this.value; state.gf.allBeans = false; state.gf.allDim = false; updateGrafik(); }); }
    bind('gbiji', 'biji'); bind('gproses', 'proses'); bind('gnegara', 'negara'); bind('gdripper', 'dripper');
    $('#gseg').addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('button') : null;
      if (!t) return;
      gf.days = t.getAttribute('data-days');
      var bs = this.querySelectorAll('button');
      for (var i = 0; i < bs.length; i++) bs[i].className = bs[i] === t ? 'on' : '';
      updateGrafik();
    });
    $('#greset').addEventListener('click', function () {
      state.gf = gf = { days: '', biji: '', proses: '', negara: '', dripper: '', dim: gf.dim, allBeans: false, allDim: false };
      renderGrafik();
    });
    $('#gcontent').addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!t) return;
      var act = t.getAttribute('data-act');
      if (act === 'dim') gf.dim = t.getAttribute('data-v'), gf.allDim = false;
      else if (act === 'allBeans') gf.allBeans = !gf.allBeans;
      else if (act === 'allDim') gf.allDim = !gf.allDim;
      else if (act === 'reset') { $('#greset').click(); return; }
      updateGrafik();
    });
    updateGrafik();
  }

  function gStat(lbl, val, title) {
    return '<div class="gstat"' + (title ? ' title="' + esc(title) + '"' : '') + '><b>' + esc(val) + '</b><span>' + esc(lbl) + '</span></div>';
  }
  function panelNote(t) { return '<div class="muted small pnote">' + t + '</div>'; }

  function updateGrafik() {
    destroyCharts();
    var gf = state.gf, box = $('#gcontent');
    if (!box) return;
    var all = state.data.seduhan;
    var rows = graphFilter(all, state.idx, gf, state.today);
    if (!rows.length) {
      box.innerHTML = emptyBox('Tidak ada seduhan yang cocok', 'Coba periode lebih panjang atau ubah filter.') +
        '<p style="text-align:center"><button type="button" class="ghost" data-act="reset">Reset filter</button></p>';
      return;
    }
    var scored = rows.filter(function (s) { return isNum(s[S.skor]); });
    var avgSc = avg(scored.map(function (s) { return s[S.skor]; }));
    var best = null;
    scored.forEach(function (s) { if (!best || s[S.skor] > best[S.skor]) best = s; });
    var nBeans = {}; rows.forEach(function (s) { nBeans[String(s[S.biji])] = 1; });

    var h = '<div class="gstats">' +
      gStat('seduhan', rows.length) + gStat('beans', Object.keys(nBeans).length) +
      gStat('rata-rata skor', avgSc === null ? '–' : fmtNum(avgSc, 1)) +
      gStat('terbaik', best ? fmtNum(best[S.skor], 1) : '–', best ? beanLabel(state.idx[best[S.biji]], best[S.biji]) + ' · ' + fmtDate(best[S.tanggal]) : '') + '</div>';

    if (!scored.length) {
      box.innerHTML = h + emptyBox('Belum ada skor', 'Isi kolom "Skor Keseluruhan (1-10)" pada seduhan agar grafik muncul.');
      return;
    }

    h += '<div class="panel"><h3>Tren skor</h3>' +
      panelNote('Satu titik = satu seduhan, garis = rata-rata 5 seduhan terakhir. <span class="dots"><i style="background:' + CLR.hi + '"></i>≥8 <i style="background:' + CLR.mid + '"></i>6–8 <i style="background:' + CLR.lo + '"></i>&lt;6</span>') +
      '<div class="chartbox sm" id="gtrendbox"><canvas id="gTrend"></canvas></div></div>';

    var bs = beanScores(rows, state.idx);
    h += '<div class="grid2"><div class="panel"><h3>Skor rata-rata per beans</h3>' +
      '<div class="hbarwrap"><div class="chartbox" id="gBeansBox"><canvas id="gBeans"></canvas></div></div>' +
      (bs.length > GF_TOP ? '<p class="tog"><button type="button" class="ghost sm" data-act="allBeans">' + (gf.allBeans ? 'Tampilkan ' + GF_TOP + ' teratas' : 'Tampilkan semua (' + bs.length + ')') + '</button></p>' : '') + '</div>';

    var ds = dimScores(rows, state.idx, gf.dim);
    h += '<div class="panel"><h3>Skor menurut</h3><div class="seg wrap" role="group">' + DIMS.map(function (x) {
      return '<button type="button" class="' + (gf.dim === x.key ? 'on' : '') + '" data-act="dim" data-v="' + x.key + '">' + esc(x.label) + '</button>';
    }).join('') + '</div>' +
      (ds.length ? '<div class="hbarwrap"><div class="chartbox" id="gDimBox"><canvas id="gDim"></canvas></div></div>' +
        (ds.length > GF_TOP ? '<p class="tog"><button type="button" class="ghost sm" data-act="allDim">' + (gf.allDim ? 'Tampilkan ' + GF_TOP + ' teratas' : 'Tampilkan semua (' + ds.length + ')') + '</button></p>' : '')
        : emptyBox('Tidak ada data', 'Kolom ini belum terisi pada seduhan yang terpilih.')) + '</div></div>';

    var act = activityBuckets(rows);
    h += '<div class="grid2"><div class="panel"><h3>Profil rasa</h3>' +
      panelNote(gf.biji ? 'Rata-rata atribut (1–5), dibanding semua beans.' : 'Rata-rata atribut SCA (1–5).') +
      '<div class="chartbox sm" id="gRadarBox"><canvas id="gRadar"></canvas></div></div>' +
      '<div class="panel"><h3>Aktivitas seduh</h3>' + panelNote(act.unit === 'week' ? 'Seduhan per pekan.' : 'Seduhan per bulan.') +
      '<div class="chartbox sm"><canvas id="gAct"></canvas></div></div></div>';
    box.innerHTML = h;

    drawTrend('gTrend', rows);
    drawHBar('gBeans', bs, { all: gf.allBeans, href: function (g) { return '#/biji/' + encodeURIComponent(g.key); }, hint: 'biji' });
    if (ds.length) drawHBar('gDim', ds, { all: gf.allDim, color: CLR.blue });
    // radar: bila satu biji dipilih, bandingkan dengan semua biji (filter lain tetap berlaku)
    var base = attrAverages(rows), cmp = null, cmpRows = null;
    if (gf.biji) {
      cmpRows = graphFilter(all, state.idx, { days: gf.days, proses: gf.proses, negara: gf.negara, dripper: gf.dripper }, state.today);
      cmp = attrAverages(cmpRows);
    }
    drawAvgRadar('gRadar', base, cmp, gf.biji ? beanLabel(state.idx[gf.biji], gf.biji) : 'Rata-rata');
    drawActivity('gAct', act.buckets);
  }

  function emptyChart(canvasId, title, text) {
    var el = document.getElementById(canvasId);
    if (el && el.parentNode) el.parentNode.innerHTML = emptyBox(title, text);
  }

  /* ---------- Chart.js ---------- */
  function drawTrend(canvasId, brews) {
    var el = document.getElementById(canvasId);
    if (!el) return;
    if (charts[canvasId]) { charts[canvasId].destroy(); delete charts[canvasId]; }
    var pts = trendPoints(brews, state.idx);
    if (!pts.length) { emptyChart(canvasId, 'Belum ada skor', 'Isi kolom "Skor Keseluruhan (1-10)" pada seduhan agar grafik muncul.'); return; }
    var lo = Math.min.apply(null, pts.map(function (p) { return p.y; }));
    var x0 = pts[0].day, x1 = pts[pts.length - 1].day;
    var pad = x1 === x0 ? 3 : Math.max(0.6, (x1 - x0) * 0.03);
    var sets = [{
      type: 'scatter', label: 'Seduhan', data: pts, pointBackgroundColor: pts.map(function (p) { return scoreColor(p.y); }),
      pointBorderColor: '#fff', pointBorderWidth: 1.5, pointRadius: pts.length > 60 ? 4 : 6, pointHoverRadius: 8, order: 1
    }];
    if (pts.length >= 4) sets.push({
      type: 'line', label: 'Rata-rata 5 terakhir', data: movingAvg(pts, 5), borderColor: CLR.blue, backgroundColor: CLR.blue,
      borderWidth: 2.5, pointRadius: 0, pointHoverRadius: 0, tension: 0.3, fill: false, order: 2
    });
    charts[canvasId] = new Chart(el, {
      type: 'scatter', data: { datasets: sets },
      options: {
        responsive: true, maintainAspectRatio: false,
        onClick: function (e, els) { if (els.length && els[0].datasetIndex === 0) { var p = pts[els[0].index]; openHref(canvasId, p.beanId ? '#/biji/' + encodeURIComponent(p.beanId) : ''); } },
        onHover: hoverPointer,
        scales: {
          x: { type: 'linear', min: x0 - pad, max: x1 + pad, grid: { display: false }, ticks: { maxTicksLimit: narrow() ? 4 : 7, precision: 0, maxRotation: 0, callback: function (v) { return Math.abs(v - Math.round(v)) < 1e-6 ? dayLabel(Math.round(v)) : ''; } } },
          y: { min: Math.max(0, Math.floor(lo) - 1), max: 10, ticks: { stepSize: 1 } }
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: function (items) { var it = items[0]; return it.datasetIndex === 0 ? truncate(pts[it.dataIndex].bean, 40) : 'Rata-rata 5 terakhir'; },
              label: function (it) {
                if (it.datasetIndex !== 0) return fmtNum(it.parsed.y, 1);
                var p = pts[it.dataIndex];
                return dayLabel(p.day) + ' · skor ' + fmtNum(p.y, 1) + (p.dripper ? ' · ' + truncate(p.dripper, 18) : '') + (p.brewId ? ' · #' + p.brewId : '');
              },
              footer: function (items) { return items[0].datasetIndex === 0 && pts[items[0].dataIndex].beanId ? (isTouch() ? 'Ketuk lagi untuk membuka beans' : 'Klik untuk membuka beans') : ''; }
            }
          }
        }
      }
    });
  }

  function drawHBar(canvasId, groups, o) {
    o = o || {};
    var el = document.getElementById(canvasId);
    if (!el) return;
    if (charts[canvasId]) { charts[canvasId].destroy(); delete charts[canvasId]; }
    var shown = o.all ? groups : groups.slice(0, GF_TOP);
    el.parentNode.style.height = Math.max(110, shown.length * 30 + 34) + 'px';
    var maxLen = narrow() ? 20 : 28;
    charts[canvasId] = new Chart(el, {
      type: 'bar',
      data: {
        labels: shown.map(function (g) { return truncate(g.label, maxLen); }),
        datasets: [{ label: 'Skor rata-rata', data: shown.map(function (g) { return Math.round(g.avg * 100) / 100; }),
          backgroundColor: shown.map(function (g) { return o.color || scoreColor(g.avg); }), borderRadius: 6, barThickness: 18 }]
      },
      plugins: [valuePlugin],
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        layout: { padding: { right: 30 } },
        onClick: function (e, els) { if (els.length && o.href) openHref(canvasId, o.href(shown[els[0].index])); },
        onHover: o.href ? hoverPointer : undefined,
        scales: {
          x: { min: 0, max: 10, ticks: { stepSize: 2 }, grid: { color: '#eef4f6' } },
          y: { grid: { display: false }, ticks: { autoSkip: false, font: { size: 11.5 } } }
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: function (items) { return truncate(shown[items[0].dataIndex].label, 60); },
              label: function (it) { var g = shown[it.dataIndex]; return 'Rata-rata ' + fmtNum(g.avg, 1) + ' · ' + g.n + ' seduhan'; },
              afterLabel: function (it) { var g = shown[it.dataIndex]; return g.n > 1 ? 'Terendah ' + fmtNum(g.min, 1) + ' · tertinggi ' + fmtNum(g.max, 1) : ''; },
              footer: function () { return o.href ? (isTouch() ? 'Ketuk lagi untuk membuka beans' : 'Klik untuk membuka beans') : ''; }
            }
          }
        }
      }
    });
  }

  function drawAvgRadar(canvasId, base, cmp, label) {
    var el = document.getElementById(canvasId);
    if (!el) return;
    if (charts[canvasId]) { charts[canvasId].destroy(); delete charts[canvasId]; }
    if (!base) { emptyChart(canvasId, 'Belum ada penilaian', 'Isi atribut Aroma sampai Balance (1–5) agar profil rasa muncul.'); return; }
    var num = function (arr) { return arr.map(function (v) { return isNum(v) ? Math.round(v * 100) / 100 : 0; }); };
    var sets = [];
    if (cmp) sets.push({ label: 'Semua beans', data: num(cmp), borderColor: '#b4b4b4', backgroundColor: 'rgba(180,180,180,.15)', pointRadius: 0, borderWidth: 2, borderDash: [5, 4] });
    sets.push({ label: truncate(label, 24), data: num(base), borderColor: CLR.blue, backgroundColor: 'rgba(0,175,241,.22)', pointBackgroundColor: CLR.blue, pointRadius: 3, borderWidth: 2.5 });
    charts[canvasId] = new Chart(el, {
      type: 'radar', data: { labels: SCA.map(function (a) { return a.label; }), datasets: sets },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { r: { min: 0, max: 5, ticks: { stepSize: 1, backdropColor: 'transparent', display: false }, pointLabels: { font: { size: 12, weight: '600' }, color: '#192025' }, grid: { color: '#dce7eb' }, angleLines: { color: '#dce7eb' } } },
        plugins: {
          legend: { display: !!cmp, position: 'bottom', labels: { boxWidth: 12, usePointStyle: true, pointStyle: 'circle' } },
          tooltip: { callbacks: { label: function (it) { return it.dataset.label + ': ' + fmtNum(it.parsed.r, 1); } } }
        }
      }
    });
  }

  function drawActivity(canvasId, buckets) {
    var el = document.getElementById(canvasId);
    if (!el) return;
    if (charts[canvasId]) { charts[canvasId].destroy(); delete charts[canvasId]; }
    if (!buckets.length) { emptyChart(canvasId, 'Belum ada tanggal', 'Isi kolom "Tanggal Seduh" agar aktivitas muncul.'); return; }
    charts[canvasId] = new Chart(el, {
      type: 'bar',
      data: { labels: buckets.map(function (b) { return b.label; }), datasets: [{ label: 'Seduhan', data: buckets.map(function (b) { return b.count; }), backgroundColor: CLR.blue, borderRadius: 6, maxBarThickness: 34 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#eef4f6' } }, x: { grid: { display: false }, ticks: { autoSkip: true, maxTicksLimit: narrow() ? 5 : 10, maxRotation: 0 } } },
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { title: function (items) { var b = buckets[items[0].dataIndex]; return (b.start !== undefined ? 'Pekan ' : '') + b.label; },
            label: function (it) { var b = buckets[it.dataIndex]; return b.count + ' seduhan' + (isNum(b.avg) ? ' · rata-rata ' + fmtNum(b.avg, 1) : ''); } } }
        }
      }
    });
  }

  function drawRadar(canvasId, brews) {
    var el = document.getElementById(canvasId);
    if (!el) return;
    if (charts[canvasId]) { charts[canvasId].destroy(); delete charts[canvasId]; }
    if (!brews.length) return;
    charts[canvasId] = new Chart(el, {
      type: 'radar',
      data: { labels: SCA.map(function (a) { return a.label; }), datasets: radarDatasets(brews, state.idx) },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { r: { min: 0, max: 5, ticks: { stepSize: 1, backdropColor: 'transparent' }, pointLabels: { font: { size: 12, weight: '600' }, color: '#192025' }, grid: { color: '#dce7eb' }, angleLines: { color: '#dce7eb' } } },
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, usePointStyle: true, pointStyle: 'circle' } } }
      }
    });
  }

  function drawTime(canvasId, beanId, type) {
    var el = document.getElementById(canvasId);
    if (!el) return;
    if (charts[canvasId]) { charts[canvasId].destroy(); delete charts[canvasId]; }
    var ser = scoreSeries(state.data.seduhan, state.idx, beanId);
    if (!ser.labels.length) {
      var p = el.parentNode;
      p.innerHTML = emptyBox('Belum ada skor', 'Isi kolom "Skor Keseluruhan (1-10)" pada seduhan agar grafik muncul.');
      return;
    }
    var isBar = type === 'bar';
    charts[canvasId] = new Chart(el, {
      type: isBar ? 'bar' : 'line',
      data: {
        labels: ser.labels,
        datasets: ser.datasets.map(function (ds) {
          return isBar ? ds : Object.assign({ tension: 0.25, spanGaps: true, pointRadius: 4, fill: false }, ds);
        })
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          y: { min: 0, max: 10, title: { display: true, text: 'Skor (1–10)' }, stacked: isBar },
          x: { stacked: isBar, ticks: { maxRotation: 60, autoSkip: true } }
        },
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, usePointStyle: true, pointStyle: 'circle' } } }
      }
    });
  }

  /* ---------- router ---------- */
  function route() {
    destroyCharts();
    var hash = (location.hash || '#/').replace(/^#/, '');
    var parts = hash.split('/').filter(Boolean);
    var r = parts[0] || 'home';
    var links = document.querySelectorAll('#nav a');
    for (var i = 0; i < links.length; i++) {
      links[i].className = links[i].getAttribute('data-r') === r ? 'active' : '';
    }
    if (!state.data) return;
    window.scrollTo(0, 0);
    try {
      if (r === 'seduhan') renderSeduhan();
      else if (r === 'biji' && parts[1]) renderBijiDetail(decodeURIComponent(parts[1]));
      else if (r === 'biji') renderBijiList();
      else if (r === 'grafik') renderGrafik();
      else if (r === 'catat') renderCatat();
      else renderHome();
    } catch (err) { showError(err); }
  }

  function showError(err) {
    var msg = err && err.message ? err.message : String(err);
    app.innerHTML = '<div class="error"><b>Gagal menampilkan data.</b><br>' + esc(msg) +
      '</div><button type="button" onclick="location.reload()">Muat ulang</button>';
  }

  function setData(data) {
    data = data || {};
    data.biji = data.biji || [];
    data.seduhan = data.seduhan || [];
    data.meta = data.meta || {};
    normalizeDates(data);
    state.data = data;
    state.idx = indexBiji(data.biji);
    state.today = data.meta.today || new Date().toISOString().slice(0, 10);
    var sub = document.getElementById('subtitle');
    sub.textContent = (data.meta.spreadsheetName ? data.meta.spreadsheetName + ' · ' : '') +
      (backendOn() ? 'jurnal dengan input & analisa AI' : 'dashboard baca-saja');
  }

  function onData(data) {
    setData(data);
    var d = state.data;
    if (d.meta.warnings && d.meta.warnings.length) {
      route();
      app.insertAdjacentHTML('afterbegin', '<div class="warn">' + d.meta.warnings.map(esc).join('<br>') + '</div>');
    } else route();
  }

  window.addEventListener('hashchange', route);

  /* ---------- panggilan ke backend Apps Script ---------- */
  /** POST text/plain (tanpa preflight CORS), ikuti redirect. Resolve dengan JSON {ok:true,...} atau reject Error(.code). */
  function api(payload) {
    var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, 110000) : null;
    var opts = { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) };
    if (ctl) opts.signal = ctl.signal;
    return fetch(BACKEND_URL, opts).then(function (r) {
      if (!r.ok) throw new Error('Server membalas HTTP ' + r.status + '.');
      return r.json();
    }, function () { throw new Error('Tidak dapat terhubung ke server. Periksa koneksi lalu coba lagi.'); })
    .then(function (j) {
      if (timer) clearTimeout(timer);
      if (!j || j.ok !== true) {
        var e = new Error((j && j.error) || 'Server mengembalikan jawaban yang tidak dikenal.');
        e.code = j && j.code;
        throw e;
      }
      return j;
    }, function (err) { if (timer) clearTimeout(timer); throw err; });
  }

  function badPin(err) { return err && (err.code === 'PIN_SALAH' || err.code === 'PIN_BELUM_DIATUR'); }
  function forgetPin() { state.pin = ''; pinStore.clear(); }

  /* ---------- halaman: catat ---------- */
  function fieldHtml(grp, f, i) {
    var id = 'f-' + grp + '-' + i, attrs = ' id="' + id + '" data-grp="' + grp + '" data-col="' + esc(f.col) + '"';
    var inp;
    if (f.type === 'area') inp = '<textarea' + attrs + ' rows="2" style="min-height:70px"></textarea>';
    else if (f.type === 'num') inp = '<input type="number" inputmode="decimal" step="' + (f.step || 'any') + '"' + (f.min !== undefined ? ' min="' + f.min + '" max="' + f.max + '"' : '') + attrs + '>';
    else if (f.type === 'date') inp = '<input type="date"' + attrs + '>';
    else inp = '<input type="text"' + attrs + (f.ph ? ' placeholder="' + esc(f.ph) + '"' : '') + '>';
    return '<div class="field' + (f.wide ? ' wide' : '') + '"><label for="' + id + '">' + esc(f.label) + (f.req ? ' *' : '') + '</label>' + inp +
      (f.hint ? '<div class="hint">' + esc(f.hint) + '</div>' : '') + '</div>';
  }

  function formHtml(grp, defs) {
    var h = '', open = false;
    defs.forEach(function (f, i) {
      if (f.section) {
        if (open) h += '</div>';
        h += '<h3 style="margin:16px 0 8px">' + esc(f.section) + '</h3><div class="fgrid">'; open = true;
      } else {
        if (!open) { h += '<div class="fgrid">'; open = true; }
        h += fieldHtml(grp, f, i);
      }
    });
    return h + (open ? '</div>' : '');
  }

  function todayLocal() { return state.today || new Date().toISOString().slice(0, 10); }

  function renderCatat() {
    var d = state.data, on = backendOn();
    var h = '<h2>Catat Seduhan</h2>';
    if (state.flash) { h += '<div class="ok" id="cflash">' + esc(state.flash) + '</div>'; state.flash = ''; }
    if (!on) {
      h += '<div class="setup"><b>Fitur Catat &amp; Analisa AI belum aktif.</b><br>Pasang backend Apps Script, lalu isi <code>BACKEND_URL</code> di bagian atas <code>index.html</code>. ' +
        'Langkahnya ada di <code>backend/SETUP-id.md</code>. Sementara itu dasbor tetap bisa dipakai membaca data.</div>';
    }
    var beans = sortBrews(d.seduhan, 'desc');
    var defBean = beans.length ? String(beans[0][S.biji]) : (d.biji.length ? String(d.biji[0][B.id]) : '__new');
    var opts = d.biji.map(function (b) {
      return '<option value="' + esc(b[B.id]) + '"' + (String(b[B.id]) === defBean ? ' selected' : '') + '>' + esc(beanLabel(b) + ' (' + b[B.id] + ')') + '</option>';
    }).join('') + '<option value="__new"' + (defBean === '__new' ? ' selected' : '') + '>➕ Beans baru…</option>';
    var stored = pinStore.get();

    h += '<fieldset id="cfs"' + (on ? '' : ' disabled') + '>' +
      '<div class="panel"><h3>PIN</h3><div class="field"><label for="cpin">PIN aplikasi</label><input type="password" id="cpin" autocomplete="current-password" inputmode="numeric" placeholder="PIN dari APP_PIN" value="' + esc(state.pin || stored) + '"></div>' +
      '<label class="check"><input type="checkbox" id="cremember"' + (stored ? ' checked' : '') + '> Ingat di perangkat ini</label>' +
      '<div class="muted small" style="margin-top:6px">PIN hanya dikirim ke backend Apps Script milikmu. Jangan centang "ingat" di perangkat bersama.</div></div>' +
      '<div class="panel"><h3>Ceritakan seduhanmu</h3><div class="field"><label for="ctext">Teks bebas</label><textarea id="ctext" placeholder="Contoh: Tadi pagi seduh Kerinci Honey pakai V60, 16 g kopi 256 g air suhu 94, grind 24 klik, 3:00. Rasanya gula merah dan jeruk manis, skor 8."></textarea></div>' +
      '<div class="row" style="margin-top:10px"><button type="button" id="cai" class="ai">✨ Bantu isi dengan AI</button><span class="muted small" id="cstatus" role="status"></span></div></div>' +
      '<div class="panel"><h3>Beans</h3><div class="field"><label for="cbiji">Pilih beans</label><select id="cbiji">' + opts + '</select></div>' +
      '<div id="cnew" style="margin-top:12px;display:' + (defBean === '__new' ? 'block' : 'none') + '"><div class="muted small" style="margin-bottom:8px">Beans baru akan ditambahkan ke tab "Biji" dengan ID otomatis.</div>' + formHtml('b', FORM_BIJI) + '</div></div>' +
      '<div class="panel"><h3>Seduhan</h3>' + formHtml('s', FORM_SEDUH) + '</div>' +
      '<div class="row"><button type="button" id="csave">Simpan</button><button type="button" id="creset" class="ghost">Kosongkan form</button><span class="muted small" id="csmsg" role="status"></span></div>' +
      '</fieldset>';
    app.innerHTML = h;
    setVal('s', 'Tanggal Seduh', todayLocal());

    function status(id, msg, kind) {
      var el = document.getElementById(id);
      el.textContent = msg || '';
      el.style.color = kind === 'err' ? 'var(--bad)' : (kind === 'ok' ? 'var(--good)' : 'var(--muted)');
    }
    function readPin(msgId) {
      var pin = $('#cpin').value.trim();
      if (!pin) { status(msgId, 'Masukkan PIN dulu.', 'err'); $('#cpin').focus(); return null; }
      state.pin = pin;
      if ($('#cremember').checked) pinStore.set(pin); else pinStore.clear();
      return pin;
    }
    function toggleNew() { $('#cnew').style.display = $('#cbiji').value === '__new' ? 'block' : 'none'; }
    $('#cbiji').addEventListener('change', toggleNew);

    $('#cai').addEventListener('click', function () {
      var text = $('#ctext').value.trim();
      if (!text) { status('cstatus', 'Tulis dulu ceritamu di kotak teks.', 'err'); return; }
      var pin = readPin('cstatus'); if (!pin) return;
      var btn = $('#cai'); btn.disabled = true; status('cstatus', 'AI sedang membaca ceritamu…');
      var known = d.biji.map(function (b) { return { id: b[B.id], nama: b[B.nama], roastery: b[B.roastery] }; });
      api({ action: 'parse', pin: pin, text: text, knownBeans: known }).then(function (j) {
        var n = applyDraft(j.draft || {});
        status('cstatus', 'Draf terisi (' + n + ' kolom). Periksa dulu, ubah bila perlu, lalu tekan Simpan.', 'ok');
        var f = $('#cbiji'); if (f && f.scrollIntoView) f.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }).catch(function (err) {
        if (badPin(err)) forgetPin();
        status('cstatus', err.message, 'err');
      }).then(function () { btn.disabled = false; });
    });

    $('#creset').addEventListener('click', function () { renderCatat(); });

    $('#csave').addEventListener('click', function () {
      var pin = readPin('csmsg'); if (!pin) return;
      var sel = $('#cbiji').value, isNew = sel === '__new';
      var seduhan = collect('s'), biji = isNew ? collect('b') : null;
      if (isNew && !biji['Nama Biji / Lot']) { status('csmsg', 'Nama beans wajib diisi untuk beans baru.', 'err'); return; }
      if (!isNew && !sel) { status('csmsg', 'Pilih beans dulu.', 'err'); return; }
      if (!seduhan['Tanggal Seduh']) { status('csmsg', 'Tanggal seduh wajib diisi.', 'err'); return; }
      if (!isNew) seduhan['ID Biji'] = sel;
      var payload = { action: 'save', pin: pin, seduhan: seduhan };
      if (isNew) payload.biji = biji;
      var btn = $('#csave'); btn.disabled = true; status('csmsg', 'Menyimpan…');
      api(payload).then(function (j) {
        var ids = j.ids || {};
        state.flash = 'Tersimpan ✔ Seduhan ' + (ids.seduhan || '') + ' untuk beans ' + (ids.biji || '') + (ids.bijiBaru ? ' (beans baru)' : '') + '.';
        if (j.data) { var nd = j.data; nd.meta = nd.meta || {}; nd.meta.today = todayLocal(); setData(nd); }
        state.source = 'backend';
        route();
      }).catch(function (err) {
        if (badPin(err)) forgetPin();
        status('csmsg', err.message, 'err');
        btn.disabled = false;
      });
    });
  }

  function fieldEl(grp, col) { return app.querySelector('[data-grp="' + grp + '"][data-col="' + col + '"]'); }
  function setVal(grp, col, val, ai) {
    var el = fieldEl(grp, col);
    if (!el) return false;
    el.value = val === null || val === undefined ? '' : String(val);
    if (el.parentNode) el.parentNode.className = el.parentNode.className.replace(/\s*\bai\b/g, '') + (ai ? ' ai' : '');
    return true;
  }
  function collect(grp) {
    var out = {};
    var els = app.querySelectorAll('[data-grp="' + grp + '"]');
    for (var i = 0; i < els.length; i++) {
      var el = els[i], v = String(el.value).trim();
      if (v === '') continue;
      out[el.getAttribute('data-col')] = el.type === 'number' ? Number(v) : v;
    }
    return out;
  }
  /** Isi form dari draf AI; kembalikan jumlah kolom terisi. */
  function applyDraft(draft) {
    var n = 0, sd = draft.seduhan || {}, bj = draft.biji || null;
    var els = app.querySelectorAll('[data-grp]');
    for (var i = 0; i < els.length; i++) { if (els[i].parentNode) els[i].parentNode.className = els[i].parentNode.className.replace(/\s*\bai\b/g, ''); }
    var sel = $('#cbiji');
    var wantId = sd['ID Biji'];
    if (wantId && state.idx[wantId]) { sel.value = String(wantId); n++; }
    else if (bj) {
      sel.value = '__new';
      Object.keys(bj).forEach(function (k) { if (setVal('b', k, bj[k], true)) n++; });
    }
    $('#cnew').style.display = sel.value === '__new' ? 'block' : 'none';
    Object.keys(sd).forEach(function (k) { if (k !== 'ID Biji' && setVal('s', k, sd[k], true)) n++; });
    return n;
  }

  /* ---------- panel analisa AI ---------- */
  function closeAnalysis() { var o = document.getElementById('aipanel'); if (o && o.parentNode) o.parentNode.removeChild(o); }

  /** host = kartu seduhan (.brew): hasil tampil di dalam kartu itu; tanpa host: panel modal. */
  function openAnalysis(target, host) {
    closeAnalysis();
    var title = target.brew ? 'Seduhan ' + target.brew : 'Beans ' + (beanLabel(state.idx[target.bean], target.bean));
    var slot = host && host.querySelector ? host.querySelector('.bai') : null;
    var ov = document.createElement('div');
    ov.id = 'aipanel';
    if (slot) {
      ov.className = 'inl';
      ov.setAttribute('role', 'region'); ov.setAttribute('aria-label', 'Analisa AI');
      ov.innerHTML = '<div class="row"><h3 style="margin:0">✨ Analisa AI</h3><span class="spacer"></span>' +
        '<button type="button" class="ghost sm" id="aiclose">Tutup</button></div><div id="aibody" style="margin-top:8px"></div>';
      slot.appendChild(ov);
      if (ov.scrollIntoView) ov.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    } else {
      ov.className = 'ovl';
      ov.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="Analisa AI"><div class="row"><h3 style="margin:0">✨ Analisa AI</h3><span class="spacer"></span>' +
        '<button type="button" class="ghost sm" id="aiclose">Tutup</button></div><div class="muted small" style="margin:2px 0 10px">' + esc(title) + '</div><div id="aibody"></div></div>';
      document.body.appendChild(ov);
      ov.addEventListener('click', function (e) { if (e.target === ov) closeAnalysis(); });
    }
    document.getElementById('aiclose').addEventListener('click', closeAnalysis);
    var body = document.getElementById('aibody');

    function pinPrompt(msg) {
      body.innerHTML = (msg ? '<div class="error">' + esc(msg) + '</div>' : '') +
        '<div class="field"><label for="aipin">PIN aplikasi</label><input type="password" id="aipin" inputmode="numeric" autocomplete="current-password"></div>' +
        '<label class="check"><input type="checkbox" id="airemember"> Ingat di perangkat ini</label>' +
        '<div class="row" style="margin-top:12px"><button type="button" id="aigo" class="ai">Lanjut</button></div>';
      document.getElementById('aigo').addEventListener('click', function () {
        var pin = document.getElementById('aipin').value.trim();
        if (!pin) return;
        state.pin = pin;
        if (document.getElementById('airemember').checked) pinStore.set(pin);
        run('');
      });
    }

    function run(question) {
      var pin = knownPin();
      if (!pin) { pinPrompt(''); return; }
      body.innerHTML = '<div class="loading" id="ailoading"><div class="spinner"></div>AI sedang menganalisa riwayat seduhanmu… (bisa 10–40 detik)</div>';
      var payload = { action: 'analyze', pin: pin };
      if (target.brew) payload.seduhanId = target.brew;
      if (target.bean) payload.bijiId = target.bean;
      if (question) payload.question = question;
      api(payload).then(function (j) {
        if (!document.getElementById('aipanel')) return;
        body.innerHTML = '<div class="aires" id="airesult">' + miniMarkdown(j.analysis) + '</div>' +
          '<div class="muted small" style="margin-top:10px">Berdasarkan ' + esc(j.usedBrews || '?') + ' dari ' + esc(j.totalBrews || '?') + ' seduhan di jurnalmu' + (j.model ? ' · model ' + esc(j.model) : '') +
          '. Saran AI hanya perkiraan dari data pribadimu, bukan kepastian; coba ubah satu variabel per seduhan.</div>' +
          '<div class="aiq"><input type="text" id="aiquestion" placeholder="Tanya lagi, mis. kenapa terasa tipis?" maxlength="500"><button type="button" id="aiask" class="ai">Tanya</button></div>';
        document.getElementById('aiask').addEventListener('click', function () {
          run(document.getElementById('aiquestion').value.trim());
        });
      }).catch(function (err) {
        if (!document.getElementById('aipanel')) return;
        if (badPin(err)) { forgetPin(); pinPrompt(err.message); return; }
        body.innerHTML = '<div class="error" id="aierror">' + esc(err.message) + '</div><button type="button" id="airetry" class="ai">Coba lagi</button>';
        document.getElementById('airetry').addEventListener('click', function () { run(question); });
      });
    }
    run('');
  }

  app.addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('[data-ai]') : null;
    if (!t || t.disabled || !backendOn()) return;
    var brew = t.getAttribute('data-brew'), bean = t.getAttribute('data-bean');
    if (brew) {
      var found = null;
      state.data.seduhan.forEach(function (s) { if (String(s[S.id]) === brew) found = s; });
      openAnalysis({ brew: brew, bean: found ? found[S.biji] : '' }, t.closest('.brew'));
    } else if (bean) openAnalysis({ bean: bean }, t.closest('.brew'));
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAnalysis(); });

  /* ---------- muat data ---------- */
  function fromJson() {
    return fetch('data.json?' + Date.now(), { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('Gagal memuat data.json (HTTP ' + r.status + ').');
      return r.json();
    });
  }
  function loadData() {
    if (!backendOn()) { state.source = 'json'; return fromJson(); }
    return fetch(backendUrl(BACKEND_URL.trim(), 'action=data'), { redirect: 'follow' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (d) {
      if (!d || !Array.isArray(d.biji) || !Array.isArray(d.seduhan)) throw new Error((d && d.error) || 'Data backend tidak valid.');
      state.source = 'backend';
      return d;
    }).catch(function () {
      state.source = 'fallback';
      setNotice('<div class="warn" id="fbnotice">Backend belum terjangkau, menampilkan <code>data.json</code> (mungkin belum terbaru).</div>');
      return fromJson();
    });
  }

  loadData()
    .then(function (d) {
      d = d || {};
      d.meta = d.meta || {};
      // "today" memakai tanggal perangkat agar umur biji selalu terkini.
      var n = new Date();
      d.meta.today = n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0');
      onData(d);
    })
    .catch(showError);

  // untuk pengujian
  window.__app = { onData: onData, state: state, route: route, openAnalysis: openAnalysis };
})();
</script>
</body>
